<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatrixBrowser JS</title>
</head>
<body>
  <main class="page">
    <h1>MatrixBrowser JS</h1>
    <p>Vertical prototype — click ▾ / ▸ on either hierarchy.</p>
    <div class="controls">
      <button type="button" id="collapse-rows">Collapse rows</button>
      <button type="button" id="expand-rows">Expand rows</button>
      <button type="button" id="collapse-columns">Collapse columns</button>
      <button type="button" id="expand-columns">Expand columns</button>
    </div>
    <div id="matrix-browser" class="panel"></div>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
